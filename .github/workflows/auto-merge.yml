name: Auto-merge eligible PRs

# Merges card PRs that the trusted eligibility workflow (merge-eligibility.yml)
# judged eligible, once their head commit has waited out the grace period and
# passed Validate info.yaml. The decision lives in
# tools/sitegen/src/validate/autoMerge.js, imported from the default branch.
#
# Switched off unless the repository variable AUTO_MERGE is exactly "true".
# Merges use a GitHub App token, because pushes made with GITHUB_TOKEN do not
# trigger other workflows and the site would not rebuild. Requires:
#   vars.AUTO_MERGE_APP_ID              the App's ID
#   secrets.AUTO_MERGE_APP_PRIVATE_KEY  its private key
# The App needs Contents and Pull requests read & write on this repository.
#
# To stop all auto-merging without admin rights, disable this workflow in the
# Actions tab; to stop one PR, add the "hold" label.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge eligible PRs
    if: vars.AUTO_MERGE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}

      - name: Merge eligible PRs
        uses: actions/github-script@v9
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          script: |
            const { decideAutoMerge } = await import(`${process.env.GITHUB_WORKSPACE}/tools/sitegen/src/validate/autoMerge.js`);
            const app = getOctokit(process.env.APP_TOKEN);
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });
            for (const listed of pulls) {
              // Re-read each PR so labels and head are current.
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: listed.number });
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: pr.head.sha, per_page: 100,
              });
              const decision = decideAutoMerge({ pr, checkRuns, now: Date.now() });
              core.info(`#${pr.number}: ${decision.merge ? 'merging' : 'skipped'}: ${decision.reason}`);
              if (!decision.merge) continue;
              try {
                // `sha` makes GitHub refuse the merge if the head moved since it was checked.
                await app.rest.pulls.merge({
                  owner, repo, pull_number: pr.number, sha: pr.head.sha, merge_method: 'squash',
                  commit_title: `${pr.title} (#${pr.number})`,
                });
              } catch (error) {
                core.warning(`#${pr.number}: merge refused: ${error.message}`);
                continue;
              }
              const verdict = checkRuns.filter(run => run.name === 'Auto-merge verdict' && run.app?.slug === 'github-actions')
                .sort((a, b) => Date.parse(b.started_at) - Date.parse(a.started_at))[0];
              await app.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: [
                  `Merged automatically at \`${pr.head.sha.slice(0, 7)}\`.`,
                  '',
                  verdict?.output?.summary?.split('\n')[0] || '',
                ].join('\n'),
              });
            }
