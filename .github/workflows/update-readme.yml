name: Update repository indexes

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: update-repository-indexes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-indexes:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: tools/sitegen/package-lock.json

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml
        npm ci --prefix tools/sitegen

    - name: Update README
      run: python .github/scripts/update-readme.py

    - name: Synchronize site curation
      run: npm run sync-curation

    - name: Check for generated changes
      id: check_changes
      run: |
        if git diff --exit-code releases/README.md tools/sitegen/src/curation/flairs.yml; then
          echo "Repository indexes are already synchronized"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "Repository indexes have changed"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit changes
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add releases/README.md tools/sitegen/src/curation/flairs.yml
        git commit -m 'Update repository indexes'
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
