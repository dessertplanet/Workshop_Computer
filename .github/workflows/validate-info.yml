name: Validate info.yaml

on:
  pull_request:
    branches:
      - main
      - workshop-ops
    paths:
      - 'releases/**/info.yaml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-info-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate changed card metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/sitegen/package-lock.json

      - name: Install validator dependencies
        run: npm ci --prefix tools/sitegen

      - name: Validate complete changed info.yaml files
        id: validate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z \
              "$BASE_SHA...$HEAD_SHA" -- ':(glob)releases/**/info.yaml'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No added or modified info.yaml files to validate."
            echo 'status=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Validating %s\n' "${files[@]}"

          set +e
          node tools/sitegen/src/validate/cli.js --json "${files[@]}" > current-validation.json
          validation_status=$?
          set -e

          node tools/sitegen/src/validate/githubReportCli.js \
            current-validation.json validation-comment.md
          cat validation-comment.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$validation_status" >> "$GITHUB_OUTPUT"

      - name: Post validation report on PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('validation-comment.md') != ''
        uses: actions/github-script@v8
        env:
          REPORT_FILE: validation-comment.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- workshop-computer-info-yaml-validation -->';
            const report = fs.readFileSync(process.env.REPORT_FILE, 'utf8');
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on validation errors
        if: always() && steps.validate.outputs.status != '0'
        run: exit 1
